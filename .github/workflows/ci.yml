name: Pd L1 Tps Cps Scorer CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "fastapi>=0.110,<1" "uvicorn>=0.29,<1" "pydantic>=2,<3" "pytest>=8,<10"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Validate browser calculator
      run: |
        node --check web/app.js
        node --test web/app.test.cjs

    - name: Security smoke test
      run: |
        python -c "from agents.base import PHIGuard, AuditLogger; assert AuditLogger.verify_integrity()"
